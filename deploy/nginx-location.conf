# Insert inside the HTTPS server block for www.loomi-ai.cn.
location = /travel-footprint-map {
    return 301 /travel-footprint-map/;
}

location ^~ /travel-footprint-map/assets/ {
    alias /var/www/travel-footprint-map/current/assets/;
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /travel-footprint-map/ {
    alias /var/www/travel-footprint-map/current/;
    index index.html;
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
}
