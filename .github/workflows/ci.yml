name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Build self-contained HTML
        run: |
          npm run build
          test -s dist/travel-map.html
      - name: Upload self-contained HTML
        uses: actions/upload-artifact@v4
        with:
          name: travel-footprint-map
          path: dist/travel-map.html
          if-no-files-found: error
